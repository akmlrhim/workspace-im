name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Mengekstrak Kode Terbaru
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install Package Laravel & Livewire
        run: composer install --optimize-autoloader --no-dev --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "25.9.0"

      - name: Compile Aset Vite & Tailwind
        run: |
          npm install
          npm run build

      - name: Kirim File ke Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env.example
            README.md
            tests/**
