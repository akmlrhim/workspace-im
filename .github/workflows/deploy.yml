name: Deploy to workspace.impostmedia.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install Composer Dependencies (Runner)
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install NPM & Build Tailwind/Vite
        run: |
          npm install
          npm run build

      - name: Copy build ke server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build"
          target: "/home/u465920647/domains/impostmedia.com/public_html/workspace.impostmedia.com/public"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            APP=/home/u465920647/domains/impostmedia.com/public_html/workspace.impostmedia.com
            DOMAIN=https://workspace.impostmedia.com

            PHP=$(command -v php8.3 2>/dev/null \
              || command -v php83 2>/dev/null \
              || command -v php 2>/dev/null)

            echo "Menggunakan PHP: $PHP ($($PHP -r 'echo PHP_VERSION;'))"
            cd $APP

            $PHP artisan down --retry=15 || true

            # Paksa server = remote, aman dari conflict / perubahan lokal
            git fetch https://${{ secrets.GH_TOKEN }}@github.com/akmlrhim/erp-impost.git main
            git reset --hard FETCH_HEAD

            COMPOSER_MEMORY_LIMIT=-1 composer install \
              --no-interaction --prefer-dist --optimize-autoloader --no-dev

            $PHP artisan migrate --force
            $PHP artisan storage:link || true

            # Set env vars SEBELUM clear cache agar config:cache langsung pakai nilai terbaru
            set_env() {
              local KEY="$1" VAL="$2"
              grep -q "^${KEY}=" .env \
                && sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" .env \
                || echo "${KEY}=${VAL}" >> .env
            }

            set_env BROADCAST_CONNECTION pusher
            set_env PUSHER_APP_ID       "${{ secrets.PUSHER_APP_ID }}"
            set_env PUSHER_APP_KEY      "${{ secrets.PUSHER_APP_KEY }}"
            set_env PUSHER_APP_SECRET   "${{ secrets.PUSHER_APP_SECRET }}"
            set_env PUSHER_APP_CLUSTER  "${{ secrets.PUSHER_APP_CLUSTER }}"

            $PHP artisan optimize:clear
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan event:cache
            $PHP artisan view:cache

            $PHP artisan queue:restart || true
            chmod -R 775 storage bootstrap/cache

            # Clear OPcache FPM di Hostinger shared hosting.
            # CLI php dan FPM punya OPcache terpisah — satu-satunya cara reset FPM
            # adalah via HTTP request ke file PHP langsung (bypass Laravel routing).
            OPCACHE_FILE="$APP/public/opcache_$(date +%s).php"
            echo '<?php if (function_exists("opcache_reset")) opcache_reset(); ?>' > "$OPCACHE_FILE"
            curl -sf --max-time 10 "$DOMAIN/$(basename $OPCACHE_FILE)" || true
            rm -f "$OPCACHE_FILE"

            CRON_SCHEDULER="* * * * * cd $APP && $PHP artisan schedule:run >> /dev/null 2>&1"
            (crontab -l 2>/dev/null | grep -qF "artisan schedule:run") \
              || (crontab -l 2>/dev/null; echo "$CRON_SCHEDULER") | crontab -

            CRON_QUEUE="* * * * * cd $APP && $PHP artisan queue:work --queue=emails,default --stop-when-empty --max-time=55 >> /dev/null 2>&1"
            (crontab -l 2>/dev/null | grep -qF "queue:work") \
              || (crontab -l 2>/dev/null; echo "$CRON_QUEUE") | crontab -

            $PHP artisan up
            echo "Deploy sukses: $(date)"
