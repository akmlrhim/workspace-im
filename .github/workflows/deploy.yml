name: Deploy to workspace.impostmedia.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/u465920647/public_html/workspace.impostmedia.com

            # Pull code terbaru
            git pull https://${{ secrets.GH_TOKEN }}@github.com/akmlrhim/erp-impost.git main

            # Install PHP dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # Install & build frontend (Tailwind + Livewire)
            npm install
            npm run build

            # Laravel setup
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link

            echo "✅ Deploy sukses: $(date)"
