name: Deploy to workspace.impostmedia.com

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM & Build Assets
        run: |
          npm ci
          npm run build

      - name: Copy build ke server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build"
          target: "/home/u465920647/domains/impostmedia.com/public_html/workspace.impostmedia.com/public"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd /home/u465920647/domains/impostmedia.com/public_html/workspace.impostmedia.com
            php artisan down --retry=60 || true
            git pull https://${{ secrets.GH_TOKEN }}@github.com/akmlrhim/erp-impost.git main
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan event:cache
            php artisan view:cache
            php artisan queue:restart || true
            chmod -R 775 storage bootstrap/cache
            php artisan up
            echo "Deploy sukses: $(date)"
